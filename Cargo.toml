[package]
name = "wedge"
version = "0.3.0"
edition = "2024"
license = "MIT"

[lib]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "wedge"
path = "src/bin/wedge.rs"

[[bin]]
name = "wedge-gui"
path = "src/bin/wedge-gui.rs"

[[bin]]
name = "mallet"
path = "src/bin/mallet.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
