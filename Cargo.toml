[package]
name = "sheesh"
version = "0.2.1"
edition = "2024"
license = "MIT"

[lib]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "sheesh"
path = "src/bin/sheesh.rs"

[[bin]]
name = "sheesh-gui"
path = "src/bin/sheesh-gui.rs"

[[bin]]
name = "kebab"
path = "src/bin/kebab.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
